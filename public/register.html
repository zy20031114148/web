<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="注册账号 - 个人博客">
    <meta name="keywords" content="JavaScript,表单事件,正则,注册校验">
    <meta name="author" content="chen">

    <title>注册账号</title>

    <!-- 注册页是独立的，不套博客的页头侧栏，所以只引这几个样式 -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body class="zhuce-page">

    <!-- 换肤还是共用的，放右上角 -->
    <div class="huanfu zhuce-huanfu" id="huanfu">
        <button type="button" class="huanfubtn" id="huanfubtn">更换皮肤</button>
        <ul class="zhutiliebiao" id="zhutilist">
            <li><button type="button" data-zhuti="theme-red">红色系</button></li>
            <li><button type="button" data-zhuti="theme-blue">蓝色系</button></li>
            <li><button type="button" data-zhuti="theme-light">还原主题</button></li>
        </ul>
    </div>

    <div class="zhuce-wrap">
        <p class="zhuce-brand"><a href="/">个人博客</a></p>
        <p class="zhuce-tip">注册个账号，方便留言</p>

        <!-- novalidate 关掉浏览器自带的校验，统一用下面这个js来提示 -->
        <form class="zhuce" id="zhuceform" action="#" method="post" novalidate>

            <div class="formhang">
                <label for="yonghuming">用户名</label>
                <input type="text" id="yonghuming" name="yonghuming" placeholder="3-16位字母、数字或下划线">
                <span class="tishi" id="tishi-yonghuming"></span>
            </div>

            <div class="formhang">
                <label for="youxiang">邮箱</label>
                <input type="text" id="youxiang" name="youxiang" placeholder="例如 student@example.com">
                <span class="tishi" id="tishi-youxiang"></span>
            </div>

            <div class="formhang">
                <label for="shouji">手机号</label>
                <input type="text" id="shouji" name="shouji" placeholder="11位数字，1开头">
                <span class="tishi" id="tishi-shouji"></span>
            </div>

            <div class="formhang">
                <label for="mima">密码</label>
                <input type="password" id="mima" name="mima" placeholder="6-20位，不能含空格">
                <span class="tishi" id="tishi-mima"></span>
            </div>

            <div class="formhang">
                <label for="mima2">确认密码</label>
                <input type="password" id="mima2" name="mima2" placeholder="再输一遍">
                <span class="tishi" id="tishi-mima2"></span>
            </div>

            <div class="anniu">
                <button type="submit" class="zhuyaobtn">注册</button>
                <button type="reset" class="cibtn">清空</button>
            </div>

            <!-- 全部通过或者有错误都显示在这 -->
            <p class="jieguotishi" id="jieguotishi"></p>
        </form>
    </div>

    <script src="js/register.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
